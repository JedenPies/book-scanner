spring:
  application:
    name: book-scanner-backend
  datasource:
    url: jdbc:postgresql://${POSTGRES_BOOK_SCANNER_HOST:localhost}:${POSTGRES_BOOK_SCANNER_PORT:5432}/${POSTGRES_BOOK_SCANNER_DATABASE:book_scanner}
    username: ${POSTGRES_BOOK_SCANNER_USERNAME:book_scanner}
    password: ${POSTGRES_BOOK_SCANNER_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true
    default-schema: public
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        concurrency: 5
        max-concurrency: 10
        prefetch: 1
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 3
          initial-interval: 2s
          multiplier: 2
          max-interval: 10s

resilience4j:
  circuitbreaker:
    instances:
      main:
        slidingWindowSize: 10 # Analizuje 10 ostatnich zapytań
        failureRateThreshold: 50 # Jeśli 50% z nich to błędy, otwórz obwód
        waitDurationInOpenState: 60s # Po otwarciu odczekaj minutę zanim spróbujesz ponownie
        recordExceptions:
          - feign.RetryableException
          - feign.FeignException.InternalServerError
          - feign.FeignException.BadGateway
          - feign.FeignException.ServiceUnavailable
          - java.lang.RuntimeException
        ignoreExceptions:
          - feign.FeignException.NotFound
          - feign.FeignException.BadRequest

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

api:
  google-books:
    url: "https://www.googleapis.com/books/v1"
    api-key: ${GOOGLE_BOOKS_API_KEY}
  open-library:
    url: "https://openlibrary.org"
  bn:
    url: "https://data.bn.org.pl"

server:
  port: 8080
