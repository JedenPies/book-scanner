plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'net.patrykdobrowolski.book-scanner'
version = '0.0.1-SNAPSHOT'

//ext {
//    set('springCloudVersion', "2023.0.0") // Użyj odpowiedniej wersji dla swojego Spring Boota
//}

java {
    sourceCompatibility = '26'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
}

repositories {
    mavenCentral()
}

dependencies {

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'

    implementation 'io.github.resilience4j:resilience4j-spring-boot4:2.4.0'

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'

    // 3. Redis (Cache dla 6-znakowych kodów parujących)
//    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    implementation 'jakarta.inject:jakarta.inject-api:2.0.1'

    implementation 'org.mapstruct:mapstruct:1.6.3'

    compileOnly 'org.projectlombok:lombok'

    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    runtimeOnly 'org.postgresql:postgresql'
//    runtimeOnly 'com.h2database:h2'

    // 6. Testy
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.amqp:spring-rabbit-test'
    // Jeśli planujesz testy z bazą w pamięci, można dorzucić H2
    // testRuntimeOnly 'com.h2database:h2'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.1.2"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}