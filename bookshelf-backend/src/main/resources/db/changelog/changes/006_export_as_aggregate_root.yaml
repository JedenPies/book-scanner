databaseChangeLog:
  - changeSet:
      id: 006-export-as-aggregate-root
      author: patryk
      changes:
        - delete:
            tableName: exports
            where: 1 = 1
        - dropColumn:
            columnName: export_id
            tableName: cataloging_sessions
        - addColumn:
            tableName: exports
            columns:
              - column:
                  name: correlation_key
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(40)
                  constraints:
                    nullable: false