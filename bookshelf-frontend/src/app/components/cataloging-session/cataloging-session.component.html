
<app-cataloging-session-header
  [sessionId]="sessionId()"
  [shareCode]="currentShareCode()"
  (openExport)="isExportModalOpen.set(true)"
  (openManualIsbn)="isManualIsbnModalOpen.set(true)"
  (openAttachScanner)="isAttachScannerModalOpen.set(true)"
/>

<app-draft-books-table
  [draftBooks]="draftBooksToShow()"
  (retry)="retryFetch($event)"
  (delete)="deleteDraftBook($event)"
  (edit)="editingDraftBook.set($event)"
/>

@if (isExportModalOpen()) {
  <app-export-modal
    [sessionId]="sessionId()"
    (closed)="isExportModalOpen.set(false)"
  />
}

@if (isManualIsbnModalOpen()) {
  <app-manual-isbn-modal
    (isbnSubmitted)="addManualIsbn($event)"
    (closed)="isManualIsbnModalOpen.set(false)"
  />
}

@if (editingDraftBook(); as draftBookToEdit) {
  <app-edit-draft-book-form-dialog
    [draftBook]="draftBookToEdit"
    (saved)="handleUpdateDraftBook($event)"
    (closed)="editingDraftBook.set(null)"
  />
}
@if (isAttachScannerModalOpen()) {
  <app-qr-code-modal
    [title]="'Attach Mobile Scanner'"
    [description]="'Scan following QR code to start scanning books with your phone camera'"
    [value]="scannerUrl()"
    (closed)="closeAttachScannerModal()"
  />
}
