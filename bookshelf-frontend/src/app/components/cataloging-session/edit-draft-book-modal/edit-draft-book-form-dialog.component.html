<div class="backdrop" (click)="close()">
  <div class="modal-content" (click)="$event.stopPropagation()">

    <div class="modal-header">
      <div class="modal-title-group">
        <h3>Edit Book Details</h3>
        <span class="badge isbn-badge">{{ draftBook().isbn }}</span>
      </div>
      <button type="button" class="btn-close" (click)="close()" title="Close">✕</button>
    </div>

    <form (ngSubmit)="submit()" class="app-form">

      <div class="form-group">
        <label for="title">Title</label>
        <input
          id="title"
          type="text"
          [ngModel]="title()"
          (ngModelChange)="title.set($event)"
          name="title"
          maxlength="500"
          placeholder="Enter book title..."
          autocomplete="off"
          autofocus
          [class.invalid]="!isValidTitle()"
        />
      </div>

      <div class="form-group">
        <label>Authors</label>
        <app-string-list-input
          [(items)]="editableAuthors"
        />
      </div>

      <div class="form-row">
        <div class="form-group flex-4">
          <label for="publisher">Publisher</label>
          <input
            id="publisher"
            type="text"
            [ngModel]="publisher()"
            (ngModelChange)="publisher.set($event)"
            name="publisher"
            maxlength="200"
            placeholder="Publisher..."
            [class.invalid]="!isValidPublisher()"
          />
        </div>

        <div class="form-group flex-1">
          <label for="publicationYear">Year</label>
          <input
            id="publicationYear"
            type="text"
            inputmode="numeric"
            [ngModel]="publicationYear()"
            (ngModelChange)="publicationYear.set($event.replace(/\D/g, ''))"
            (beforeinput)="onYearBeforeInput($event)"
            name="publicationYear"
            maxlength="4"
            placeholder="YYYY"
            [class.invalid]="!isValidPublicationYear()"
          />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group flex-3">
          <label for="publicationPlace">Publication place</label>
          <input
            id="publicationPlace"
            type="text"
            [ngModel]="publicationPlace()"
            (ngModelChange)="publicationPlace.set($event)"
            name="publicationPlace"
            maxlength="200"
            placeholder="City..."
            [class.invalid]="!isValidPublicationPlace()"
          />
        </div>

        <div class="form-group flex-1">
          <label for="language">Language</label>
          <input
            id="language"
            type="text"
            [ngModel]="language()"
            (ngModelChange)="language.set($event)"
            name="language"
            maxlength="50"
            placeholder="e.g. eng, pol"
            [class.invalid]="!isValidLanguage()"
          />
        </div>
      </div>

      <div class="form-group">
        <label>Genres</label>
        <app-string-list-input
          [(items)]="editableGenres"
        />
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-cancel" (click)="close()">Cancel</button>
        <button type="submit" class="btn-primary" [disabled]="!isFormValid()">Save changes</button>
      </div>

    </form>
  </div>
</div>
